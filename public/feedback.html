<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Guesser - Feedback</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .feedback-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #1B1E31;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            background-color: #2A2D42;
            color: #fff;
            border-radius: 4px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .rating-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .rating-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .rating-option:hover {
            background-color: rgba(76, 175, 80, 0.1);
        }
        
        .rating-option.selected {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        
        .submit-btn:hover {
            background-color: #3e8e41;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ccc;
            text-decoration: none;
        }
        
        .back-link:hover {
            color: #4CAF50;
        }
        
        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        
        .success-message {
            color: #4CAF50;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="feedback-container">
        <h1 style="text-align: center; color: #4CAF50; margin-bottom: 30px;">Game Feedback</h1>
        
        <div class="form-group">
            <label>How would you rate your overall experience?</label>
            <div class="rating-container">
                <div class="rating-option" data-rating="1">1</div>
                <div class="rating-option" data-rating="2">2</div>
                <div class="rating-option" data-rating="3">3</div>
                <div class="rating-option" data-rating="4">4</div>
                <div class="rating-option" data-rating="5">5</div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="liked">What did you like about the game?</label>
            <textarea id="liked" placeholder="Tell us what you enjoyed..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="improvements">What could be improved?</label>
            <textarea id="improvements" placeholder="Tell us what could be better..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="additional-comments">Additional comments</label>
            <textarea id="additional-comments" placeholder="Any other thoughts..."></textarea>
        </div>
        
        <button class="submit-btn" id="submit-feedback">Submit Feedback</button>
        
        <div class="error-message" id="feedback-error"></div>
        <div class="success-message" id="feedback-success"></div>
        
        <a href="../game.html" class="back-link">Back to Game</a>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let selectedRating = 0;
            
            // Rating selection
            const ratingOptions = document.querySelectorAll('.rating-option');
            ratingOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove selected class from all options
                    ratingOptions.forEach(opt => opt.classList.remove('selected'));
                    
                    // Add selected class to clicked option
                    this.classList.add('selected');
                    
                    // Store rating value
                    selectedRating = parseInt(this.getAttribute('data-rating'));
                });
            });
            
            // Submit feedback
            const submitBtn = document.getElementById('submit-feedback');
            const errorMessage = document.getElementById('feedback-error');
            const successMessage = document.getElementById('feedback-success');
            
            submitBtn.addEventListener('click', async function() {
                // Reset messages
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
                
                // Validation
                if (selectedRating === 0) {
                    errorMessage.textContent = 'Please select a rating';
                    errorMessage.style.display = 'block';
                    return;
                }
                
                const liked = document.getElementById('liked').value;
                const improvements = document.getElementById('improvements').value;
                const additionalComments = document.getElementById('additional-comments').value;
                
                // Get token if user is logged in
                const token = localStorage.getItem('token');
                
                try {
                    const headers = {
                        'Content-Type': 'application/json'
                    };
                    
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }
                    
                    const response = await fetch('http://localhost:3000/api/feedback', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({
                            rating: selectedRating,
                            liked,
                            improvements,
                            additionalComments
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Feedback submitted successfully
                        successMessage.textContent = 'Thank you for your feedback!';
                        successMessage.style.display = 'block';
                        
                        // Clear form
                        ratingOptions.forEach(opt => opt.classList.remove('selected'));
                        selectedRating = 0;
                        document.getElementById('liked').value = '';
                        document.getElementById('improvements').value = '';
                        document.getElementById('additional-comments').value = '';
                        
                        // Redirect back to game after 3 seconds
                        setTimeout(() => {
                            window.location.href = '../game.html';
                        }, 3000);
                    } else {
                        errorMessage.textContent = data.message || 'Error submitting feedback';
                        errorMessage.style.display = 'block';
                    }
                } catch (error) {
                    errorMessage.textContent = 'Error connecting to server';
                    errorMessage.style.display = 'block';
                    console.error('Feedback submission error:', error);
                }
            });
        });
    </script>
</body>
</html>
